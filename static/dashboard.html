<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevNote — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0b0b12;
        --surface: #13131f;
        --surface-2: #1c1c2e;
        --surface-3: #242436;
        --border: #2d2d45;
        --border-light: #38385a;
        --accent: #f0a030;
        --accent-hover: #ffb84d;
        --accent-dim: rgba(240, 160, 48, 0.12);
        --text: #dde1f0;
        --text-muted: #6b7299;
        --text-dim: #3d4266;
        --danger: #e05252;
        --danger-dim: rgba(224, 82, 82, 0.1);
        --success: #4ade80;
        --md-color: #38bdf8;
        --md-bg: rgba(56, 189, 248, 0.1);
        --txt-color: #94a3b8;
        --txt-bg: rgba(148, 163, 184, 0.08);
        --sidebar-w: 260px;
        --radius: 8px;
        --transition: 0.15s ease;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
      }

      /* ==============================
       SIDEBAR
    ============================== */
      .sidebar {
        width: var(--sidebar-w);
        min-width: var(--sidebar-w);
        height: 100vh;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-header {
        padding: 20px 16px 14px;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-mark {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-dim);
        border: 1px solid rgba(240, 160, 48, 0.2);
        padding: 3px 7px;
        border-radius: 4px;
        letter-spacing: 0.05em;
      }

      .logo-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      /* New document button */
      .new-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: calc(100% - 24px);
        margin: 14px 12px 10px;
        padding: 9px 14px;
        background: var(--accent);
        border: none;
        border-radius: var(--radius);
        color: #0b0b12;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--transition);
      }

      .new-btn:hover {
        background: var(--accent-hover);
      }

      .new-btn-icon {
        font-size: 18px;
        line-height: 1;
        font-weight: 400;
      }

      /* Document list */
      .doc-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px;
      }

      .doc-list::-webkit-scrollbar {
        width: 4px;
      }
      .doc-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .doc-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .doc-list-empty {
        padding: 32px 16px;
        text-align: center;
        color: var(--text-muted);
      }

      .doc-list-empty p {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .doc-list-empty span {
        font-size: 12px;
        color: var(--text-dim);
      }

      .doc-item {
        position: relative;
        padding: 10px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background var(--transition);
        margin-bottom: 2px;
      }

      .doc-item:hover {
        background: var(--surface-2);
      }
      .doc-item.active {
        background: var(--surface-3);
      }
      .doc-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 20px;
        background: var(--accent);
        border-radius: 0 2px 2px 0;
      }

      .doc-item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .doc-item-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .doc-item-delete {
        opacity: 0;
        font-size: 14px;
        color: var(--text-muted);
        padding: 2px 4px;
        border-radius: 4px;
        transition: all var(--transition);
        flex-shrink: 0;
      }

      .doc-item:hover .doc-item-delete {
        opacity: 1;
      }
      .doc-item-delete:hover {
        color: var(--danger);
        background: var(--danger-dim);
      }

      .doc-item-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }

      .format-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        font-weight: 600;
        padding: 2px 5px;
        border-radius: 3px;
        letter-spacing: 0.04em;
      }

      .format-badge.markdown {
        color: var(--md-color);
        background: var(--md-bg);
      }
      .format-badge.plaintext {
        color: var(--txt-color);
        background: var(--txt-bg);
      }

      .doc-item-time {
        font-size: 11px;
        color: var(--text-dim);
      }

      /* Sidebar footer */
      .sidebar-footer {
        padding: 14px 12px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent-dim);
        border: 1px solid rgba(240, 160, 48, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        flex-shrink: 0;
      }

      .user-name {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .logout-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 16px;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        transition: all var(--transition);
        flex-shrink: 0;
      }

      .logout-btn:hover {
        color: var(--danger);
        background: var(--danger-dim);
      }

      /* ==============================
       MAIN EDITOR AREA
    ============================== */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Empty state */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--text-muted);
      }

      .empty-icon {
        font-size: 40px;
        opacity: 0.3;
      }

      .empty-state h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .empty-state p {
        font-size: 13px;
        color: var(--text-dim);
      }

      .empty-hint {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
        background: var(--surface-2);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
      }

      /* Editor container */
      .editor-wrap {
        display: none;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }

      /* Editor header */
      .editor-header {
        padding: 20px 28px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .title-input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .title-input::placeholder {
        color: var(--text-dim);
      }

      /* Format toggle pill */
      .format-toggle {
        display: flex;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px;
        gap: 2px;
        flex-shrink: 0;
      }

      .fmt-btn {
        padding: 5px 12px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        border-radius: 4px;
        cursor: pointer;
        transition: all var(--transition);
      }

      .fmt-btn.active {
        background: var(--surface-3);
        color: var(--text);
      }

      .fmt-btn.active.md {
        color: var(--md-color);
      }
      .fmt-btn.active.txt {
        color: var(--txt-color);
      }

      /* Pin button */
      .pin-btn {
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
        padding: 5px;
        border-radius: 5px;
        transition: all var(--transition);
        color: var(--text-dim);
        flex-shrink: 0;
      }

      .pin-btn:hover,
      .pin-btn.pinned {
        color: var(--accent);
      }

      /* Delete button */
      .delete-doc-btn {
        background: none;
        border: 1px solid transparent;
        color: var(--text-dim);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all var(--transition);
        flex-shrink: 0;
      }

      .delete-doc-btn:hover {
        color: var(--danger);
        border-color: rgba(224, 82, 82, 0.3);
        background: var(--danger-dim);
      }

      /* Textarea */
      .doc-textarea {
        flex: 1;
        padding: 24px 28px;
        background: none;
        border: none;
        outline: none;
        resize: none;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        line-height: 1.7;
      }

      .doc-textarea.monospace {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }

      .doc-textarea::placeholder {
        color: var(--text-dim);
      }

      /* Status bar */
      .status-bar {
        padding: 10px 28px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .save-status {
        font-size: 12px;
        transition: color var(--transition);
      }

      .save-status.saving {
        color: var(--accent);
      }
      .save-status.saved {
        color: var(--success);
      }
      .save-status.error {
        color: var(--danger);
      }

      .char-count {
        color: var(--text-dim);
      }

      .kbd-hint {
        margin-left: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--text-dim);
        background: var(--surface-2);
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      /* ==============================
       DELETE MODAL
    ============================== */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        width: 320px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .modal h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .modal p {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 24px;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .modal-btn {
        padding: 9px 18px;
        border-radius: 7px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        border: none;
      }

      .modal-btn.cancel {
        background: var(--surface-2);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .modal-btn.cancel:hover {
        color: var(--text);
      }

      .modal-btn.danger {
        background: var(--danger);
        color: white;
      }

      .modal-btn.danger:hover {
        opacity: 0.85;
      }

      /* ==============================
       SPLIT PANE (Markdown mode)
    ============================== */
      .editor-body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .editor-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }

      /* Preview pane — hidden by default, shown in Markdown mode */
      .preview-pane {
        display: none;
        flex: 1;
        overflow-y: auto;
        padding: 24px 28px;
        border-left: 1px solid var(--border);
        background: var(--surface);
        min-width: 0;
      }

      .preview-pane.visible {
        display: block;
      }

      .preview-pane::-webkit-scrollbar {
        width: 4px;
      }
      .preview-pane::-webkit-scrollbar-track {
        background: transparent;
      }
      .preview-pane::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .preview-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 600;
        color: var(--md-color);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 20px;
        opacity: 0.5;
      }

      /* ==============================
       MARKDOWN RENDERED CONTENT
    ============================== */
      .md-preview {
        line-height: 1.75;
        color: var(--text);
      }

      .md-preview h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 0 0 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }
      .md-preview h2 {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        margin: 28px 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .md-preview h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        margin: 22px 0 8px;
      }
      .md-preview h4,
      .md-preview h5,
      .md-preview h6 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 18px 0 6px;
      }
      .md-preview p {
        margin: 0 0 14px;
      }
      .md-preview strong {
        color: var(--text);
        font-weight: 600;
      }
      .md-preview em {
        color: var(--text-muted);
        font-style: italic;
      }

      .md-preview a {
        color: var(--md-color);
        text-decoration: none;
        border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      }
      .md-preview a:hover {
        border-color: var(--md-color);
      }

      /* Inline code */
      .md-preview code {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--md-color);
        padding: 2px 6px;
        border-radius: 4px;
      }

      /* Code blocks */
      .md-preview pre {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        overflow-x: auto;
        margin: 0 0 16px;
      }
      .md-preview pre code {
        background: none;
        border: none;
        padding: 0;
        color: var(--text);
        font-size: 13px;
        line-height: 1.6;
      }

      .md-preview blockquote {
        border-left: 3px solid var(--accent);
        margin: 0 0 16px;
        padding: 10px 16px;
        background: var(--accent-dim);
        border-radius: 0 var(--radius) var(--radius) 0;
        color: var(--text-muted);
      }

      .md-preview ul,
      .md-preview ol {
        margin: 0 0 14px;
        padding-left: 22px;
      }
      .md-preview li {
        margin-bottom: 4px;
      }

      .md-preview hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 24px 0;
      }

      .md-preview table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 16px;
      }
      .md-preview th,
      .md-preview td {
        padding: 8px 12px;
        border: 1px solid var(--border);
        font-size: 13px;
      }
      .md-preview th {
        background: var(--surface-2);
        font-weight: 600;
        color: var(--text-muted);
      }
      .md-preview tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <!-- ==============================
       SIDEBAR
  ============================== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-mark">DN</span>
          <span class="logo-text">DevNote</span>
        </div>
      </div>

      <button class="new-btn" onclick="createDocument()">
        <span class="new-btn-icon">+</span>
        New Document
      </button>

      <div class="doc-list" id="docList">
        <!-- Populated by JS -->
      </div>

      <div class="sidebar-footer">
        <div class="user-avatar" id="userAvatar">--</div>
        <span class="user-name" id="userName">Loading...</span>
        <button class="logout-btn" onclick="logout()" title="Log out">⏻</button>
      </div>
    </aside>

    <!-- ==============================
       MAIN EDITOR
  ============================== -->
    <main class="main">
      <!-- Empty state (shown when no doc is open) -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌨</div>
        <h2>No document open</h2>
        <p>Select a document from the sidebar, or create a new one.</p>
        <span class="empty-hint">+ New Document</span>
      </div>

      <!-- Editor (hidden until a doc is opened) -->
      <div class="editor-wrap" id="editorWrap">
        <div class="editor-header">
          <input
            type="text"
            id="docTitle"
            class="title-input"
            placeholder="Untitled Document"
            oninput="triggerAutoSave()"
          />

          <!-- Format toggle -->
          <div class="format-toggle">
            <button
              class="fmt-btn md"
              id="fmtMd"
              onclick="setFormat('markdown')"
            >
              Markdown
            </button>
            <button
              class="fmt-btn txt"
              id="fmtTxt"
              onclick="setFormat('plaintext')"
            >
              Plain Text
            </button>
          </div>

          <!-- Pin toggle -->
          <button
            class="pin-btn"
            id="pinBtn"
            onclick="togglePin()"
            title="Pin document"
          >
            📌
          </button>

          <!-- Delete -->
          <button class="delete-doc-btn" onclick="confirmDelete()">
            Delete
          </button>
        </div>

        <!-- Split pane: editor left, preview right (preview only visible in Markdown mode) -->
        <div class="editor-body">
          <div class="editor-pane">
            <textarea
              id="docContent"
              class="doc-textarea"
              placeholder="Start writing..."
              oninput="onContentInput()"
            ></textarea>
          </div>
          <div class="preview-pane" id="previewPane">
            <div class="preview-label">Preview</div>
            <div class="md-preview" id="mdPreview"></div>
          </div>
        </div>

        <div class="status-bar">
          <span class="save-status saved" id="saveStatus">✓ Saved</span>
          <span class="char-count" id="charCount">0 chars</span>
          <span class="kbd-hint">Ctrl + S to save</span>
        </div>
      </div>
    </main>

    <!-- ==============================
       DELETE CONFIRMATION MODAL
  ============================== -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <h3>Delete document?</h3>
        <p id="deleteModalMsg">This action cannot be undone.</p>
        <div class="modal-actions">
          <button class="modal-btn cancel" onclick="closeModal()">
            Cancel
          </button>
          <button class="modal-btn danger" onclick="deleteDocument()">
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      // ================================
      //  STATE
      // ================================
      let currentDocId = null; // ID of the document currently open in the editor
      let currentIsPinned = false;
      let currentFormat = "plaintext";
      let documents = []; // Local cache of the user's document list
      let autoSaveTimer = null; // Debounce timer handle
      let deleteTargetId = null; // Which doc the delete modal is targeting

      // ================================
      //  API HELPER
      //  Attaches JWT and handles 401s
      // ================================
      async function api(method, path, body = null) {
        const token = sessionStorage.getItem("devnote_token");

        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);

        const res = await fetch(path, options);

        // Token expired or invalid — kick back to login
        if (res.status === 401) {
          sessionStorage.removeItem("devnote_token");
          window.location.href = "/";
          return null;
        }

        // 204 No Content (e.g. DELETE success)
        if (res.status === 204) return true;

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");
        return data;
      }

      // ================================
      //  INITIALIZATION
      // ================================
      async function init() {
        const token = sessionStorage.getItem("devnote_token");
        if (!token) {
          window.location.href = "/";
          return;
        }

        await loadUser();
        await loadDocuments();
      }

      async function loadUser() {
        const user = await api("GET", "/api/auth/me");
        if (!user) return;

        document.getElementById("userAvatar").textContent = user.username
          .slice(0, 2)
          .toUpperCase();
        document.getElementById("userName").textContent = user.username;
      }

      // ================================
      //  DOCUMENT LIST
      // ================================
      async function loadDocuments() {
        documents = (await api("GET", "/api/documents/")) || [];
        renderList();
      }

      function renderList() {
        const list = document.getElementById("docList");

        if (documents.length === 0) {
          list.innerHTML = `
          <div class="doc-list-empty">
            <p>No documents yet</p>
            <span>Click + New Document to get started</span>
          </div>`;
          return;
        }

        list.innerHTML = documents
          .map(
            (doc) => `
        <div
          class="doc-item ${doc.id === currentDocId ? "active" : ""}"
          onclick="openDocument(${doc.id})"
          data-id="${doc.id}"
        >
          <div class="doc-item-top">
            <span class="doc-item-title">${escHtml(doc.title || "Untitled Document")}</span>
            <span
              class="doc-item-delete"
              onclick="event.stopPropagation(); confirmDelete(${doc.id})"
              title="Delete"
            >✕</span>
          </div>
          <div class="doc-item-meta">
            <span class="format-badge ${doc.format}">
              ${doc.format === "markdown" ? "MD" : "TXT"}
            </span>
            <span class="doc-item-time">${timeAgo(doc.updated_at)}</span>
            ${doc.is_pinned ? '<span style="font-size:11px">📌</span>' : ""}
          </div>
        </div>
      `,
          )
          .join("");
      }

      // ================================
      //  CREATE DOCUMENT
      // ================================
      async function createDocument() {
        try {
          const doc = await api("POST", "/api/documents/", {
            title: "Untitled Document",
            content: "",
            format: "plaintext",
          });

          if (!doc) return;
          documents.unshift(doc);
          renderList();
          openDocument(doc.id, doc); // Open it immediately
        } catch (err) {
          alert("Could not create document: " + err.message);
        }
      }

      // ================================
      //  OPEN / LOAD DOCUMENT
      // ================================
      async function openDocument(id, preloaded = null) {
        // Save any pending changes to the current doc before switching
        if (currentDocId && autoSaveTimer) {
          clearTimeout(autoSaveTimer);
          await saveNow();
        }

        currentDocId = id;

        const doc = preloaded || (await api("GET", `/api/documents/${id}`));
        if (!doc) return;

        // Populate editor
        document.getElementById("docTitle").value = doc.title || "";
        document.getElementById("docContent").value = doc.content || "";
        currentFormat = doc.format || "plaintext";
        currentIsPinned = doc.is_pinned || false;

        updateFormatUI();
        updatePinUI();
        updateCharCount();
        setSaveStatus("saved");

        // Show editor, hide empty state
        document.getElementById("emptyState").style.display = "none";
        document.getElementById("editorWrap").style.display = "flex";

        // Highlight active item in sidebar
        document.querySelectorAll(".doc-item").forEach((el) => {
          el.classList.toggle("active", parseInt(el.dataset.id) === id);
        });

        document.getElementById("docContent").focus();
      }

      // ================================
      //  FORMAT
      // ================================
      function setFormat(fmt) {
        if (!currentDocId) return;
        currentFormat = fmt;
        updateFormatUI();
        triggerAutoSave();
      }

      function updateFormatUI() {
        const isMd = currentFormat === "markdown";
        document.getElementById("fmtMd").classList.toggle("active", isMd);
        document.getElementById("fmtTxt").classList.toggle("active", !isMd);
        document
          .getElementById("docContent")
          .classList.toggle("monospace", isMd);

        // Show preview pane only in Markdown mode
        document
          .getElementById("previewPane")
          .classList.toggle("visible", isMd);

        // Render immediately when switching to Markdown
        if (isMd) renderPreview();
      }

      // ================================
      //  MARKDOWN PREVIEW
      // ================================
      function renderPreview() {
        if (currentFormat !== "markdown") return;
        const content = document.getElementById("docContent").value;
        // marked.parse() converts the raw Markdown string into rendered HTML
        document.getElementById("mdPreview").innerHTML = marked.parse(content);
      }

      // ================================
      //  PIN
      // ================================
      async function togglePin() {
        if (!currentDocId) return;
        currentIsPinned = !currentIsPinned;
        updatePinUI();

        try {
          const updated = await api("PUT", `/api/documents/${currentDocId}`, {
            is_pinned: currentIsPinned,
          });
          if (updated) {
            const idx = documents.findIndex((d) => d.id === currentDocId);
            if (idx !== -1) documents[idx] = updated;
            // Re-sort: pinned first
            documents.sort(
              (a, b) =>
                b.is_pinned - a.is_pinned ||
                new Date(b.updated_at) - new Date(a.updated_at),
            );
            renderList();
          }
        } catch (err) {
          // Revert on error
          currentIsPinned = !currentIsPinned;
          updatePinUI();
        }
      }

      function updatePinUI() {
        const btn = document.getElementById("pinBtn");
        btn.classList.toggle("pinned", currentIsPinned);
        btn.title = currentIsPinned ? "Unpin document" : "Pin document";
      }

      // ================================
      //  SAVE (auto + manual)
      // ================================
      function triggerAutoSave() {
        setSaveStatus("saving");
        clearTimeout(autoSaveTimer);
        // Render preview + save 1.5 seconds after the user stops typing
        autoSaveTimer = setTimeout(() => {
          renderPreview();
          saveNow();
        }, 1500);
      }

      async function saveNow() {
        if (!currentDocId) return;

        const title =
          document.getElementById("docTitle").value.trim() ||
          "Untitled Document";
        const content = document.getElementById("docContent").value;

        try {
          const updated = await api("PUT", `/api/documents/${currentDocId}`, {
            title,
            content,
            format: currentFormat,
          });

          if (!updated) return;

          // Refresh local cache
          const idx = documents.findIndex((d) => d.id === currentDocId);
          if (idx !== -1) {
            documents[idx] = updated;
            renderList();
          }

          setSaveStatus("saved");
        } catch (err) {
          setSaveStatus("error");
        }
      }

      // ================================
      //  STATUS BAR
      // ================================
      function setSaveStatus(status) {
        const el = document.getElementById("saveStatus");
        el.className = `save-status ${status}`;
        el.textContent =
          {
            saving: "● Saving...",
            saved: "✓ Saved",
            error: "⚠ Error saving",
          }[status] || "";
      }

      function onContentInput() {
        updateCharCount();
        triggerAutoSave();
      }

      function updateCharCount() {
        const len = document.getElementById("docContent").value.length;
        document.getElementById("charCount").textContent =
          len.toLocaleString() + " char" + (len !== 1 ? "s" : "");
      }

      // ================================
      //  DELETE
      // ================================
      function confirmDelete(id = null) {
        deleteTargetId = id || currentDocId;
        if (!deleteTargetId) return;

        const doc = documents.find((d) => d.id === deleteTargetId);
        const name = doc ? `"${doc.title}"` : "this document";
        document.getElementById("deleteModalMsg").textContent =
          `Delete ${name}? This cannot be undone.`;

        document.getElementById("deleteModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("deleteModal").style.display = "none";
        deleteTargetId = null;
      }

      async function deleteDocument() {
        if (!deleteTargetId) return;

        try {
          await api("DELETE", `/api/documents/${deleteTargetId}`);

          documents = documents.filter((d) => d.id !== deleteTargetId);

          // If we deleted the currently open doc, reset the editor
          if (deleteTargetId === currentDocId) {
            currentDocId = null;
            document.getElementById("editorWrap").style.display = "none";
            document.getElementById("emptyState").style.display = "flex";
          }

          closeModal();
          renderList();
        } catch (err) {
          alert("Could not delete: " + err.message);
        }
      }

      // ================================
      //  LOGOUT
      // ================================
      function logout() {
        sessionStorage.removeItem("devnote_token");
        window.location.href = "/";
      }

      // ================================
      //  UTILITIES
      // ================================
      function escHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      function timeAgo(dateStr) {
        const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
        if (diff < 60) return "just now";
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        return `${Math.floor(diff / 86400)}d ago`;
      }

      // ================================
      //  KEYBOARD SHORTCUTS
      // ================================
      document.addEventListener("keydown", (e) => {
        // Ctrl/Cmd + S — immediate save
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          if (currentDocId) {
            clearTimeout(autoSaveTimer);
            renderPreview();
            saveNow();
          }
        }
        // Escape — close modal
        if (e.key === "Escape") closeModal();
      });

      // ================================
      //  BOOT
      // ================================
      init();
    </script>
  </body>
</html>
